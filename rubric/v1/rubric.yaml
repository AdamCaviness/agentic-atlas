rubric_version: 5.0.0
title: Agentic Atlas Rubric
description: >
  An opinionated, versioned rubric for locating agentic development approaches on
  signed, diverging axes, open to adoption and adaptation by the community. Sign
  conventions and weights are deliberate positions, not defaults: disagree, trace it
  to the indicators, and open a pull request against this version. Any change that
  can move a score for identical evidence requires a MAJOR bump. See docs/versioning.md.

# Every axis is a signed position on the same range, -scale..+scale. A single
# shared scale is what makes positions comparable across axes, so it is a rubric
# wide constant, not a per-axis knob. It is a display multiplier on the normalized
# weighted mean and does not change any relative position.
scale: 10

# Files a judged answer may not cite as evidence. A judged quote must describe the method
# the tool ships today, so these globs exclude text that describes something else. Matched
# against the answer's path relative to the target root, case-sensitively, with the same
# glob syntax as path signals (`**` spans directories, `*` stays within one segment).
evidence_exclude:
  # Release history records what changed in the past, not what the tool does now.
  - "**/CHANGELOG.*"
  - "**/HISTORY.md"
  - "**/RELEASE-NOTES*"
  - "**/RELEASE_NOTES*"
  - "**/RELEASE-v*"
  - "**/.changeset/**"
  # Tests and fixtures exercise the tool; they do not instruct its users.
  - "**/test/**"
  - "**/tests/**"
  - "**/__tests__/**"
  - "**/fixtures/**"
  # Example and use-case projects are built with the tool, not part of its method.
  - "examples/**"
  - "use-cases/**"
  # The tool's own working folders and design records: task boards, change proposals,
  # plans, specs, design notes, and research written while developing the tool, which can
  # describe work that never shipped, plus archived material the tool no longer ships.
  - ".taskmaster/**"
  - "openspec/changes/**"
  - "openspec/work/**"
  - "openspec/initiatives/**"
  - "openspec/explorations/**"
  - "docs/plans/**"
  - ".plans/**"
  - "docs/superpowers/plans/**"
  - "docs/superpowers/specs/**"
  - ".kiro/specs/**"
  - ".claude/PRPs/**"
  - "backlog/**"
  - "docs/brainstorms/**"
  - "docs/adr/**"
  - "docs/designs/**"
  - "docs/research/**"
  - "**/archived/**"
  # How the tool's own repository is run: contributor guides, CI, and issue templates
  # describe developing the tool, not using it.
  - "**/CONTRIBUTING.md"
  - ".github/workflows/**"
  - ".github/ISSUE_TEMPLATE/**"

# Active axes, in display order (grouped: context, style, process, architecture,
# footprint). Each id maps to axes/<id>/axis.yaml.
axes:
  - greenfield-vs-brownfield
  - small-scope-vs-large-scope
  - prototype-vs-production
  - solo-vs-team
  - generalist-vs-specialist
  - fresh-vs-mature
  - interrogative-vs-opinionated
  - autonomous-vs-human-in-loop
  - spec-light-vs-spec-driven
  - test-optional-vs-test-first
  - single-agent-vs-multi-agent
  - prescriptive-vs-composable
  - lightweight-vs-heavyweight
