id: test-optional-vs-test-first
title: Test-optional vs Test-first
poles:
  negative: test_optional
  positive: test_first
description: >
  How central testing is to the approach. Negative means testing is incidental or left
  to the user. Positive means test-first discipline (TDD) is enforced.
explain:
  negative: testing is incidental, left to your judgment
  positive: test-first discipline (TDD) is built in and enforced
indicators:
  - id: tests-first
    question: "Does it enforce writing tests before implementation (TDD)?"
    kind: judged
    weight: 3
    # True zero (AD-6): "encouraged" means tests are recommended but not enforced before code,
    # genuinely balanced between test-optional and test-first. Extremes are +-1.0 (AD-3).
    answers: { "no": -1.0, encouraged: 0.0, enforced: 1.0 }
  - id: testing-phase
    question: "Is testing a first-class phase, or incidental?"
    kind: judged
    weight: 2
    # "present" means a testing phase exists but is not test-first.
    # True zero (AD-6): the middle answer sits halfway between the two poles, so it maps to
    # 0.0. A tilt away from zero needs a written argument, and none exists for this one.
    answers: { incidental: -1.0, present: 0.0, first_class: 1.0 }
