id: lightweight-vs-heavyweight
title: Lightweight vs Heavyweight
poles:
  negative: lightweight
  positive: heavyweight
description: >
  How much a user must take on to adopt the approach. Negative means a small
  footprint and little ceremony. Positive means many concepts, roles, and steps. lw1
  weighs how many concepts and how much ceremony must be learned before getting
  value, lw2 the install and setup footprint.
explain:
  negative: small footprint, few concepts, little to learn before you start
  positive: many concepts, roles, and steps to take on
indicators:
  - id: lw1
    question: "How many concepts and how much ceremony must a user learn before getting value?"
    kind: classified
    weight: 3
    # True zero (AD-6): a "moderate" set of concepts to learn is the balanced middle between a
    # minimal tool and a heavy methodology. Extremes are +-1.0 (AD-3).
    answers: { minimal: -1.0, moderate: 0.0, heavy: 1.0 }
  - id: lw2
    question: "How large is the install and setup footprint?"
    kind: classified
    weight: 2
    answers: { tiny: -1.0, moderate: 0.0, large: 1.0 }
