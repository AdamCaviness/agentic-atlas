id: prototype-vs-production
title: Prototype vs Production
poles:
  negative: prototype
  positive: production
description: >
  What kind of output the approach optimizes for. Negative means fast, throwaway, proof-
  of-concept output. Positive means production hardening: tests, CI, security, and
  maintainability.
explain:
  negative: fast, throwaway output to prove an idea
  positive: hardened output with tests, CI, security, and maintainability in mind
indicators:
  - id: production-hardening
    question: "How much emphasis on production hardening (CI, deployment, security, observability)?"
    kind: judged
    weight: 3
    # Extremes are +-1.0 (AD-3).
    # True zero (AD-6): the middle answer sits halfway between the two poles, so it maps to
    # 0.0. A tilt away from zero needs a written argument, and none exists for this one.
    answers: { none: -1.0, some: 0.0, strong: 1.0 }
  - id: throwaway-tolerance
    question: "Is throwaway or vibe output acceptable, or does it insist on maintainable code?"
    kind: judged
    weight: 2
    answers: { throwaway_ok: -1.0, mixed: 0.0, maintainable_only: 1.0 }
  - id: non-functional-requirements
    question: >-
      Does its default workflow require a written statement of non-functional requirements
      (performance, security, reliability, or scalability; any one counts) for the work being
      built, filled in by the user or the agent? Answer "prompted" when such a section or
      question is optional, conditional on task size, or skippable, and "no" when the
      workflow names none of them (a generic "any constraints?" question is "no").
    kind: judged
    weight: 2
    # Whether production qualities are specified up front, separate from operational
    # hardening (production-hardening) and code maintainability (throwaway-tolerance), AD-5.
    # True zero (AD-6): "prompted" (a template section or a suggestion, not required) is the
    # balanced middle.
    answers: { "no": -1.0, prompted: 0.0, required: 1.0 }
  - id: review-before-done
    question: >-
      Before a change counts as done, must it pass a review of its quality (correctness,
      security, maintainability) by a reviewer other than the implementing agent: a separate
      agent or a person? Answer "required" when the review runs and gates by default, even if
      a flag can skip it. Answer "optional" when the review is offered, advisory (it runs but
      cannot block), or is a checklist the implementing agent applies to its own work. A
      test or lint run alone is not a review.
    kind: judged
    weight: 2
    # A quality review of the finished change, separate from who the tool is built for:
    # solo-vs-team measures handoffs between people, and this counts an agent reviewer the
    # same as a human one (AD-5). Testing is measured on test-optional-vs-test-first, so a
    # test run alone is not a review. A reviewer that also checks the change against the spec
    # answers both this and spec-verification: code quality and spec conformance are separate
    # facets that one step can cover. True zero (AD-6): "optional" is the balanced middle.
    answers: { none: -1.0, optional: 0.0, required: 1.0 }
