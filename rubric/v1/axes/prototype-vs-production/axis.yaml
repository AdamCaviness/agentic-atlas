id: prototype-vs-production
title: Prototype vs Production
poles:
  negative: prototype
  positive: production
description: >
  What kind of output the approach optimizes for. Negative means fast, throwaway, proof-
  of-concept output. Positive means production hardening: tests, CI, security, and
  maintainability.
explain:
  negative: fast, throwaway output to prove an idea
  positive: hardened output with tests, CI, security, and maintainability in mind
indicators:
  - id: production-hardening
    question: "How much emphasis on production hardening (CI, deployment, security, observability)?"
    kind: judged
    weight: 3
    # Extremes are +-1.0 (AD-3).
    # True zero (AD-6): the middle answer sits halfway between the two poles, so it maps to
    # 0.0. A tilt away from zero needs a written argument, and none exists for this one.
    answers: { none: -1.0, some: 0.0, strong: 1.0 }
  - id: throwaway-tolerance
    question: "Is throwaway or vibe output acceptable, or does it insist on maintainable code?"
    kind: judged
    weight: 2
    answers: { throwaway_ok: -1.0, mixed: 0.0, maintainable_only: 1.0 }
