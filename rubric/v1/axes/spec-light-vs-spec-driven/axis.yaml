id: spec-light-vs-spec-driven
title: Spec-light vs Spec-driven
poles:
  negative: spec_light
  positive: spec_driven
description: >
  How much written design specification precedes code. Negative means it jumps to
  implementation, or works from a ticket or task alone. Positive means it produces and
  follows a written specification (a PRD, design, or requirements document) before
  coding. A ticket or work item is not a specification, so this axis measures whether
  design intent is written up front, not whether a unit of work is tracked.
explain:
  negative: jumps straight to implementation, or works from a ticket alone
  positive: writes and follows a design specification before coding
indicators:
  - id: spec-required
    question: >-
      Is a written design specification (a PRD, design doc, or written plan, not merely a
      ticket or work item) required before implementation begins?
    kind: judged
    weight: 3
    # True zero (AD-6): extremes are +-1.0 and the middle answer is a genuine neutral, not
    # a defaulted positive. "encouraged" means recommended but not enforced, balanced
    # between the poles, so it maps to 0.0. A tool that requires only a ticket answers
    # "none": a ticket is a work item, not a design specification (AD-5).
    answers: { none: -1.0, encouraged: 0.0, required: 1.0 }
  - id: spec-documents
    question: >-
      Does the workflow produce and persist specification documents (a PRD, design, or
      requirements doc), as opposed to only tickets, task lists, or code?
    kind: judged
    weight: 2
    # Producing a ticket or a tasks.json is producing a work item, not a specification
    # (AD-5), so it is the negative pole. "some" is an argued lean, not a defaulted middle:
    # producing any specification document is real evidence of spec-driven practice.
    answers: { "no": -1.0, some: 0.3, "yes": 1.0 }
