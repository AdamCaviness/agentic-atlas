id: spec-light-vs-spec-driven
title: Spec-light vs Spec-driven
poles:
  negative: spec_light
  positive: spec_driven
description: >
  How much written design specification precedes code. Negative means it jumps to
  implementation, or works from a ticket or task alone. Positive means it produces and
  follows a written specification (a PRD, design, or requirements document) before
  coding. A ticket or work item is not a specification, so this axis measures whether
  design intent is written up front, not whether a unit of work is tracked.
explain:
  negative: jumps straight to implementation, or works from a ticket alone
  positive: writes and follows a design specification before coding
indicators:
  - id: spec-required
    question: >-
      Is a written design specification (a PRD, design doc, or written plan, not merely a
      ticket or work item) required before implementation begins?
    kind: judged
    weight: 3
    # True zero (AD-6): extremes are +-1.0 and the middle answer is a genuine neutral, not
    # a defaulted positive. "encouraged" means recommended but not enforced, balanced
    # between the poles, so it maps to 0.0. A tool that requires only a ticket answers
    # "none": a ticket is a work item, not a design specification (AD-5).
    answers: { none: -1.0, encouraged: 0.0, required: 1.0 }
  - id: spec-documents
    question: >-
      Does the workflow produce and persist specification documents (a PRD, design, or
      requirements doc), as opposed to only tickets, task lists, or code?
    kind: judged
    weight: 2
    # Producing a ticket or a tasks.json is producing a work item, not a specification
    # (AD-5), so it is the negative pole. "some" is an argued lean, not a defaulted middle:
    # producing any specification document is real evidence of spec-driven practice.
    answers: { "no": -1.0, some: 0.3, "yes": 1.0 }
  - id: spec-verification
    question: >-
      After implementation, is the result checked against the written specification (tasks
      traced to requirements, or a review or verification step that compares the code to the
      spec)? Answer "partial" when the check covers only the task list or some requirements,
      or runs only when a spec file exists. A tool with no specification answers "no".
    kind: judged
    weight: 2
    # Whether the spec constrains the finished work, separate from whether a spec is required
    # (spec-required) or persisted (spec-documents), AD-5: a tool can write a PRD and never
    # look at it again. True zero (AD-6): "partial" (checked against the task list or only
    # some requirements) is the middle.
    answers: { "no": -1.0, partial: 0.0, "yes": 1.0 }
  - id: spec-lifecycle
    question: >-
      When a later change alters behavior a specification describes, does the workflow require
      updating that specification so it stays the source of truth ("living"), or is each
      specification written for one piece of work and then left, closed, or archived
      ("written_once")? A specification that may be edited but is not required to be is
      "written_once". When the docs offer several models with no default, grade the one the
      main workflow follows. A tool with no specification answers "none".
    kind: judged
    weight: 2
    # How long the spec lives, separate from whether one is written (spec-documents), AD-5:
    # two tools can both persist a PRD while only one updates it with each change. A ticket or
    # per-change spec that is closed when the work ships is "written_once". "written_once"
    # sits at the true zero (AD-6): a spec that exists but is not maintained is halfway
    # between no spec and a living one.
    answers: { none: -1.0, written_once: 0.0, living: 1.0 }
