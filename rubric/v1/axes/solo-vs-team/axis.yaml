id: solo-vs-team
title: Solo vs Team
poles:
  negative: solo
  positive: team
description: >
  Who the approach is built for. Negative means a single developer working alone.
  Positive means multiple contributors, with team-safe collaboration and handoffs.
explain:
  negative: built for one developer working alone
  positive: built for many contributors, with team-safe collaboration and handoffs
indicators:
  - id: team-coordination
    question: "Does it provide team-safe collaboration (claiming or assigning work, avoiding conflicts between contributors)?"
    kind: judged
    weight: 3
    # True zero (AD-6): "partial" collaboration support (present but not central) is the
    # balanced middle. Extremes are +-1.0 (AD-3).
    answers: { none: -1.0, partial: 0.0, strong: 1.0 }
  - id: human-handoffs
    question: "Are there defined handoffs between people or human reviewers?"
    kind: judged
    weight: 2
    # True zero (AD-6): the middle answer sits halfway between the two poles, so it maps to
    # 0.0. A tilt away from zero needs a written argument, and none exists for this one.
    answers: { none: -1.0, some: 0.0, many: 1.0 }
  - id: shared-work-state
    question: >-
      By default, where does it keep the state of the work (plans, tasks, progress)? Answer
      "local" for one developer's machine (a session, a store outside the repository, or
      project files the docs keep out of version control), "repository" for files committed
      to the repository (including a tracker that stores its data in git), and "team_tool"
      for a hosted tool the team shares, such as an issue tracker or project board. When the
      tool syncs between stores by default, answer the most shared one.
    kind: judged
    weight: 2
    # Whether other people can see the work in progress, separate from conflict avoidance
    # (team-coordination) and handoffs (human-handoffs), AD-5. "repository" sits at the true
    # zero (AD-6): committed files reach collaborators through git, but nothing in them is
    # built for several people working at once.
    answers: { local: -1.0, repository: 0.0, team_tool: 1.0 }
