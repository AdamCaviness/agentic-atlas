id: solo-vs-team
title: Solo vs Team
poles:
  negative: solo
  positive: team
description: >
  Who the approach is built for. Negative means a single developer working alone.
  Positive means multiple contributors, with team-safe collaboration and handoffs.
explain:
  negative: built for one developer working alone
  positive: built for many contributors, with team-safe collaboration and handoffs
indicators:
  - id: team-coordination
    question: "Does it provide team-safe collaboration (claiming or assigning work, avoiding conflicts between contributors)?"
    kind: judged
    weight: 3
    # True zero (AD-6): "partial" collaboration support (present but not central) is the
    # balanced middle. Extremes are +-1.0 (AD-3).
    answers: { none: -1.0, partial: 0.0, strong: 1.0 }
  - id: human-handoffs
    question: "Are there defined handoffs between people or human reviewers?"
    kind: judged
    weight: 2
    # True zero (AD-6): the middle answer sits halfway between the two poles, so it maps to
    # 0.0. A tilt away from zero needs a written argument, and none exists for this one.
    answers: { none: -1.0, some: 0.0, many: 1.0 }
