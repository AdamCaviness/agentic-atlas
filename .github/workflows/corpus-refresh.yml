# Report when the committed profile corpus falls behind each source repo's default-branch tip.
#
# Weekly (and on demand): run `scripts/corpus.py status` and, when any pin is behind origin
# HEAD, open or update one tracking issue with the drift report. It never moves pins: a pin
# move breaks every judged quote the tool's authors have reworded, and only a model can
# restore those, so an automated pin-move PR could never merge. Re-answering is manual: answer
# each drifted tool at HEAD, then apply the answers with `scripts/corpus.py answer --write`.
#
# Does not block the CI gate on main: freshness is a maintenance loop, not a merge check.
name: Corpus refresh

on:
  schedule:
    # Mondays 14:00 UTC
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: corpus-refresh
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install (editable, with dev deps)
        run: pip install -e ".[dev]"

      - name: Detect pin drift
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rc=0
          python scripts/corpus.py status > drift.txt || rc=$?
          cat drift.txt
          # status exits 1 for drift and prints a DRIFT line per behind pin. Any other failure
          # (a crash, a traceback) must fail the job, not overwrite the issue with a partial report.
          if [ "$rc" -eq 0 ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 1 ] && grep -q " DRIFT " drift.txt; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "corpus.py status failed (exit $rc) without a drift report" >&2
            exit 1
          fi

      - name: Open, update, or close the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          DRIFT: ${{ steps.status.outputs.drift }}
        run: |
          title="Corpus drift: profile pins behind source HEAD"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ "$DRIFT" != "true" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "Every profile pin now matches its source's default-branch HEAD."
              echo "closed issue #$existing"
            fi
            exit 0
          fi
          {
            echo "The weekly corpus check found profiles pinned behind their source's default-branch HEAD."
            echo "Pins are not moved automatically. To refresh, re-answer each drifted tool at HEAD and"
            echo "apply the answers with \`scripts/corpus.py answer --answers-dir DIR --write\`."
            echo
            echo '```'
            cat drift.txt
            echo '```'
          } > body.md
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file body.md
            echo "updated issue #$existing"
          else
            gh issue create --title "$title" --body-file body.md
          fi
