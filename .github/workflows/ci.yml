# The project's CI gate, the same checks as `make check`, run on every pull request and on
# pushes to main.
#
# The steps mirror the Makefile's `check` target (lint, docs sync, corpus sync, site build,
# tests) but install straight into the runner's interpreter rather than a local venv, on the
# Python version the project targets (`requires-python = ">=3.13"` in pyproject.toml).
#
# The job is named `ci` so it reports a single status check named `ci`, which the branch
# ruleset on main requires before the branch can be updated.
#
# The GitHub Pages deploy (static.yml) is gated on this workflow: it triggers via
# `workflow_run` only after CI completes successfully on main, so a red build never ships to
# the hosted Explorer.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install (editable, with dev deps)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Axis README scoring blocks in sync
        run: agentic-atlas docs rubric/v1 --check
      - name: Committed profile corpus in sync
        run: python scripts/check_corpus.py
      - name: Explorer site builds and its JS parses
        run: python scripts/check_site.py
      - name: Tests
        run: pytest -q
